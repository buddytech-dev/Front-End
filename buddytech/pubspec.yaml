# -------------------------------------------
#   Projeto BuddyTech – Configuração Flutter
# -------------------------------------------

name: buddytech
description: "Aplicação BuddyTech – MVP com Login via Supabase."
publish_to: 'none'

# -------------------------------------------
#       Versão do App
# -------------------------------------------
version: 1.0.0+1

# -------------------------------------------
#   Versão do SDK Dart/Flutter suportado
# -------------------------------------------
environment:
  sdk: ">=3.9.2 <4.0.0"

# -------------------------------------------
#          DEPENDÊNCIAS DO APP
# -------------------------------------------
dependencies:
  flutter:
    sdk: flutter

  # Ícones padrão iOS (usados por muitos widgets)
  cupertino_icons: ^1.0.8

  # Biblioteca oficial do Supabase para Flutter
  supabase_flutter: ^2.10.3

  # Permite usar arquivo .env com chaves privadas (SUPABASE_URL / SUPABASE_KEY)
  flutter_dotenv: ^6.0.0

# -------------------------------------------
#       DEPENDÊNCIAS DE DESENVOLVIMENTO
# -------------------------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Regras de lint recomendadas (boas práticas)
  flutter_lints: ^5.0.0

# -------------------------------------------
#         CONFIGURAÇÕES FLUTTER
# -------------------------------------------
flutter:

  # Habilita o uso do pacote Material Icons
  uses-material-design: true

  # -----------------------------------------
  #    ASSETS do projeto
  # -----------------------------------------
  assets:
    - assets/
    - assets/logo.png
    - assets/.env

  # -----------------------------------------
  #  (Opcional) Configurar fontes personalizadas
  # -----------------------------------------
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700